<!-- Helecho - una sola fronda de culantrillo, Adiantum subvolubile, el
     único helecho de la guía: un raquis que arranca abajo a la izquierda y
     se arquea hacia arriba y a la derecha, con pinnas en abanico a los
     lados.

     El culantrillo no se reconoce por la fronda triangular del helecho de
     los cuentos sino por las pinnas: pequeñas, en forma de abanico o de
     media luna, cada una colgando de un pecíolo cortísimo y negro, alternas
     a un lado y a otro del raquis. Por eso cada pinna es una cuña con el
     borde redondo y un rabito, y van menguando hacia la punta. Son ocho:
     cuatro grandes abajo y cuatro chicas arriba. Sin suelo: la fronda sale
     de una grieta y lo que importa es el arco, no el pie. No se confunde
     con nada del juego porque es el único dibujo que no sube derecho. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
