<!-- Parásita - la cuscuta, Cuscuta foetida, la única del grupo: un hilo sin
     hojas ni raíz enroscado en el tallo de otra planta, de la que vive.

     Aquí hay dos plantas y hay que ver cuál es cuál. La huésped es el tallo
     recto del centro con dos hojas arriba: es ella la que tiene hojas, y
     por eso van, para que se entienda que lo que da vueltas no es suyo. La
     cuscuta es el muelle: tres vueltas APRETADAS alrededor del tallo, y de
     cada extremo un cabo suelto y flojo, uno que cuelga hacia el suelo y
     otro que se descuelga a la derecha buscando otro apoyo. Lo que la
     separa de la trepadora es que no tiene hoja ninguna, que las vueltas
     son muchas y juntas y no pocas y anchas, y que lo que abraza es una
     planta con hojas, no una vara. Y de la Ephedra, que también va sin
     hojas, la separa que ésta es un hilo blando que se enrosca y aquélla
     una escoba tiesa. Sin línea de suelo: la cuscuta no toca el suelo, vive
     en el aire. -->
