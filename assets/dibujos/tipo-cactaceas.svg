<!-- Cactácea - un solo cactus columnar, al modo de Armatocereus procerus o
     Haageocereus acranthus: una columna gruesa de punta redonda, con un
     brazo que sale en codo por la izquierda.

     Lo que lo hace cactus son las COSTILLAS, dos líneas verticales que
     dividen la columna en tres gajos, y las espinas: pares en uve sobre las
     costillas y púas cortas que asoman por el borde. La mancha tenue le da
     cuerpo, pero la columna se lee sola por el contorno. Es el único dibujo
     del juego sin una línea curva de hoja ni de rama: todo es vertical y
     romo. La zona de cactáceas del juego de hábitats son tres columnas
     flacas y separadas; ésta es una sola, ancha, para que se vean las
     costillas, que allí no caben. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
