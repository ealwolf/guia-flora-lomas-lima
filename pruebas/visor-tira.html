<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banco de pruebas · la tira del visor</title>

<!-- La hoja de estilos DE VERDAD. Lo que se ve aquí son las reglas que usa
     la app; si cambian allí, cambian aquí. Lo único propio de esta página
     son los mandos, el marco y el barrido. -->
<link rel="stylesheet" href="../app/css/estilos.css">

<style>
  html, body { margin: 0; height: 100%; }

  /* ---------- la página de mandos ---------- */
  body.mandos {
    background: var(--fondo); color: var(--texto);
    font: 400 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; height: 100%;
  }
  .cabecera { padding: 14px 18px 12px; border-bottom: 1px solid var(--borde); }
  .cabecera h1 { margin: 0 0 3px; font-size: 17px; }
  .cabecera p { margin: 0; color: var(--tenue); font-size: 13px; max-width: 78ch; }
  .mandos-fila {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px;
    padding: 11px 18px; border-bottom: 1px solid var(--borde);
  }
  .mandos-fila label { font-size: 13px; font-weight: 600; color: var(--tenue); }
  .mandos-fila input[type=range] { width: 170px; vertical-align: middle; }
  .anchos { display: flex; flex-wrap: wrap; gap: 6px; }
  .anchos button, .barrido-btn {
    font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 8px;
    border: 1px solid var(--borde-control); background: var(--superficie);
    color: var(--texto); cursor: pointer;
  }
  .anchos button[aria-pressed="true"] {
    background: var(--acento); border-color: var(--acento); color: #fff;
  }
  .barrido-btn { font-weight: 600; }
  .escenario {
    flex: 1; min-height: 0; display: grid; place-items: center;
    padding: 18px; background: var(--superficie-2);
    background-image:
      linear-gradient(45deg, rgba(128,128,128,.07) 25%, transparent 25%, transparent 75%, rgba(128,128,128,.07) 75%),
      linear-gradient(45deg, rgba(128,128,128,.07) 25%, transparent 25%, transparent 75%, rgba(128,128,128,.07) 75%);
    background-size: 22px 22px; background-position: 0 0, 11px 11px;
  }
  .escenario iframe {
    border: 0; height: 100%; max-height: 780px; width: 100%;
    border-radius: 14px; box-shadow: 0 10px 34px rgba(0,0,0,.3); background: #000;
  }
  .informe {
    display: none; padding: 12px 18px 16px; border-top: 1px solid var(--borde);
    font: 400 12px/1.6 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre; overflow: auto; max-height: 42vh; background: var(--superficie);
  }
  .informe.sale { display: block; }
  .informe .bien { color: #1d7a3e; font-weight: 700; }
  .informe .mal { color: #b3261e; font-weight: 700; }

  /* ---------- el marco ---------- */
  body.marco { background: #000; overflow: hidden; }
  .medidas {
    position: fixed; left: 50%; bottom: 50%; translate: -50% 0;
    z-index: 100; color: #fff;   /* el visor va en 90 */
    font: 400 12px/1.6 ui-monospace, Menlo, Consolas, monospace;
    background: rgba(0,0,0,.72); border: 1px solid rgba(255,255,255,.2);
    border-radius: 10px; padding: 9px 13px; white-space: pre; pointer-events: none;
  }
  .medidas b { color: #8ee6a8; font-weight: 400; }
  .medidas .mal { color: #ff9a9a; }
</style>

<body>
<script>
(function () {
  var par = new URLSearchParams(location.search);
  var esMarco = par.has('n');

  /* Doce fotos de la propia guía. Con menos de siete no se puede ver lo que
     esta página existe para ver -el recorte de la última-, porque la tira
     cabe entera: hoy la ficha con más fotos de toda la guía tiene cuatro. */
  var FOTOS = ['001_adiantum-subvolubile', '002_ephedra-americana',
    '003_anthericum-eccremorrhizum', '004_oziroe-biflora',
    '005_alstroemeria-lineatiflora', '006_ismene-amancaes',
    '007_stenomesson-flavum', '008_puya-ferruginea',
    '009_tillandsia-latifolia', '010_tillandsia-purpurea',
    '011_commelina-fasciculata', '012_tinantia-erecta']
    .map(function (s) { return '../app/img/' + s + '_principal1.avif'; });

  var CARET = {
    izq: 'M163.66 216a8 8 0 0 1-11.32 0l-80-80a8 8 0 0 1 0-11.32l80-80a8 8 0 1 1 11.32 11.32L89.31 128l74.35 74.34a8 8 0 0 1 0 11.66',
    der: 'M181.66 133.66l-80 80a8 8 0 0 1-11.32-11.32L164.69 128L90.34 53.66a8 8 0 0 1 11.32-11.32l80 80a8 8 0 0 1 0 11.32'
  };
  function caret(d) {
    return '<svg class="ico" viewBox="0 0 256 256" aria-hidden="true">' +
           '<path fill="currentColor" d="' + CARET[d] + '"/></svg>';
  }

  // ===================================================== el marco
  if (esMarco) {
    document.body.className = 'marco';
    /* Sin barra de desplazamiento: si no, un marco pedido de 375 px mide 360
       por dentro y las cifras de abajo dirían otra cosa que los mandos. */
    document.documentElement.style.overflow = 'hidden';
    var n = Math.max(1, Math.min(FOTOS.length, +par.get('n') || 1));
    var i = 0;

    document.body.innerHTML =
      '<div class="visor abierto">' +
        '<div class="visor-carril"><div class="visor-hoja">' +
          '<img id="grande" src="' + FOTOS[0] + '" alt=""></div></div>' +
        '<div class="visor-arriba">' +
          '<span class="visor-cuenta" id="cuenta"></span>' +
          '<button id="x" aria-label="Cerrar"></button>' +
        '</div>' +
        '<div class="visor-abajo" id="abajo"></div>' +
      '</div>' +
      '<div class="medidas" id="medidas"></div>';

    document.getElementById('x').innerHTML =
      '<svg class="ico" viewBox="0 0 256 256" aria-hidden="true" width="22" height="22">' +
      '<path fill="currentColor" d="M205.66 194.34a8 8 0 0 1-11.32 11.32L128 139.31l-66.34 ' +
      '66.35a8 8 0 0 1-11.32-11.32L116.69 128L50.34 61.66a8 8 0 0 1 11.32-11.32L128 ' +
      '116.69l66.34-66.35a8 8 0 0 1 11.32 11.32L139.31 128Z"/></svg>';

    var abajo = document.getElementById('abajo');
    abajo.innerHTML = n < 2 ? '' :
      '<div class="visor-tira-caja">' +
        '<div class="visor-tira">' + FOTOS.slice(0, n).map(function (s, k) {
          return '<button data-k="' + k + '" aria-label="Foto ' + (k + 1) + '" ' +
                 'aria-current="' + (k === 0) + '"><img src="' + s + '" alt=""></button>';
        }).join('') + '</div>' +
        '<button class="tira-flecha izq" aria-label="Anteriores" tabindex="-1">' + caret('izq') + '</button>' +
        '<button class="tira-flecha der" aria-label="Siguientes" tabindex="-1">' + caret('der') + '</button>' +
      '</div>';

    function tira() { return abajo.querySelector('.visor-tira'); }

    function bordes() {
      var t = tira(); if (!t) return;
      var hay = t.scrollWidth > t.clientWidth + 1;
      t.parentNode.classList.toggle('hay-izq', hay && t.scrollLeft > 2);
      t.parentNode.classList.toggle('hay-der',
        hay && t.scrollLeft < t.scrollWidth - t.clientWidth - 2);
    }

    function ir(k) {
      i = k;
      document.getElementById('grande').src = FOTOS[k];
      var t = tira();
      [].forEach.call(t.querySelectorAll('[data-k]'), function (x) {
        x.setAttribute('aria-current', +x.dataset.k === k ? 'true' : 'false');
      });
      if (t.scrollWidth > t.clientWidth + 1) {
        var act = t.querySelector('[aria-current="true"]');
        t.scrollTo({ left: act.offsetLeft - (t.clientWidth - act.offsetWidth) / 2,
                     behavior: 'smooth' });
      }
      medir();
    }

    abajo.addEventListener('click', function (ev) {
      var f = ev.target.closest('.tira-flecha');
      if (f) {
        var t = tira(), b = t.querySelector('[data-k]');
        var paso = (b ? b.offsetWidth + 8 : 62) * 3;
        t.scrollBy({ left: f.classList.contains('izq') ? -paso : paso, behavior: 'smooth' });
        return;
      }
      var b2 = ev.target.closest('[data-k]');
      if (b2) ir(+b2.dataset.k);
    });
    abajo.addEventListener('wheel', function (ev) {
      var t = ev.target.closest('.visor-tira');
      if (!t || t.scrollWidth <= t.clientWidth + 1) return;
      var d = Math.abs(ev.deltaY) > Math.abs(ev.deltaX) ? ev.deltaY : ev.deltaX;
      if (!d) return;
      t.scrollLeft += d; ev.preventDefault();
    }, { passive: false });
    abajo.addEventListener('scroll', function (ev) {
      if (ev.target.classList.contains('visor-tira')) { bordes(); medir(); }
    }, true);

    /* Lo que mide el barrido de la página de mandos. Vive aquí porque sólo
       aquí se sabe el ancho real de la ventana del marco. */
    window.ver = function () {
      var t = tira(), W = document.documentElement.clientWidth;
      if (!t) return { W: W, n: n, tira: 0, mini: 0, enteras: 0, desborda: false, asoma: 0 };
      var bs = t.querySelectorAll('button');
      var mini = bs[0].getBoundingClientRect().width;
      var paso = bs.length > 1 ? bs[1].offsetLeft - bs[0].offsetLeft : mini;
      var rt = t.getBoundingClientRect(), ra = abajo.getBoundingClientRect();
      return {
        W: W, n: n, mini: Math.round(mini), paso: Math.round(paso),
        tira: Math.round(rt.width), velo: Math.round(ra.width),
        centrada: Math.abs((rt.left + rt.width / 2) - (ra.left + ra.width / 2)) < 1.5,
        desborda: t.scrollWidth > t.clientWidth + 1,
        /* Cuántas miniaturas se ven ENTERAS de una vez. Es la cifra del
           barrido: al ensanchar la pantalla no puede bajar nunca. */
        enteras: Math.min(n, Math.floor((t.clientWidth + 8) / paso)),
        asoma: Math.round(t.clientWidth % paso)
      };
    };

    function medir() {
      var v = window.ver();
      document.getElementById('cuenta').textContent = n > 1 ? (i + 1) + ' de ' + n : '';
      var txt = 'ventana      ' + v.W + ' px\n' + 'fotos        ' + n + '\n';
      if (!tira()) {
        txt += 'tira         no sale: con una sola foto no hay nada que elegir';
      } else {
        txt += 'miniatura    ' + v.mini + ' px\n' +
               'tira         ' + v.tira + ' px de ' + v.velo + '   ' +
                 (v.centrada ? '<b>centrada</b>' : '<span class="mal">DESCENTRADA</span>') + '\n' +
               'se ven       ' + v.enteras + ' de ' + n + ' enteras\n' +
               'desborda     ' + (v.desborda ? '<b>sí</b>' : 'no, caben todas') + '\n' +
               'recorte      ' + (v.desborda
                 ? (v.asoma > 4 ? '<b>sí</b>: asoman ' + v.asoma + ' de ' + v.mini + ' px'
                    : '<span class="mal">no</span>: corta en el borde de una miniatura')
                 : '—') + '\n' +
               'flechas      ' + (v.desborda ? 'con ratón, del lado que queda tira' : 'no hacen falta');
      }
      document.getElementById('medidas').innerHTML = txt;
    }
    addEventListener('resize', function () { bordes(); medir(); });
    if (n > 1) { bordes(); ir(0); } else { medir(); }
    return;
  }

  // ================================================== la página de mandos
  document.body.className = 'mandos';
  var ANCHOS = [320, 360, 375, 414, 598, 600, 602, 768, 1024, 0];
  var ancho = 768, cuantas = 8;

  document.body.innerHTML =
    '<div class="cabecera">' +
      '<h1>La tira de miniaturas del visor</h1>' +
      '<p>Carga <code>app/css/estilos.css</code>, o sea las reglas de verdad. El marco ' +
      'de abajo es un <code>iframe</code>, o sea una ventana propia, así que lo que ' +
      'depende del ancho responde a su ancho y no al de esta página. Hoy la ficha con ' +
      'más fotos de la guía tiene cuatro: con siete u ocho se ve lo que pasará el día ' +
      'que haya más.</p>' +
    '</div>' +
    '<div class="mandos-fila">' +
      '<label for="n">Fotos: <output id="nv"></output></label>' +
      '<input type="range" id="n" min="1" max="12" step="1">' +
      '<label>Ancho del marco</label>' +
      '<div class="anchos" id="anchos"></div>' +
      '<button class="barrido-btn" id="barrer">Barrer 300 → 1280 px</button>' +
    '</div>' +
    '<div class="escenario"><iframe id="marco" title="El visor"></iframe></div>' +
    '<div class="informe" id="informe"></div>';

  var rango = document.getElementById('n'), marco = document.getElementById('marco');
  var informe = document.getElementById('informe');
  rango.value = cuantas;

  document.getElementById('anchos').innerHTML = ANCHOS.map(function (a) {
    return '<button data-a="' + a + '">' + (a ? a + ' px' : 'todo el ancho') + '</button>';
  }).join('');

  function pintar() {
    document.getElementById('nv').textContent = cuantas;
    marco.style.width = ancho ? ancho + 'px' : '100%';
    marco.src = location.pathname + '?n=' + cuantas;
    [].forEach.call(document.querySelectorAll('[data-a]'), function (b) {
      b.setAttribute('aria-pressed', +b.dataset.a === ancho ? 'true' : 'false');
    });
  }
  rango.addEventListener('input', function () { cuantas = +rango.value; pintar(); });
  document.getElementById('anchos').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-a]');
    if (b) { ancho = +b.dataset.a; pintar(); }
  });

  /* El barrido ensancha el marco píxel a píxel y comprueba lo único que de
     verdad no puede pasar: que al ENSANCHAR la pantalla se vean MENOS fotos
     que antes. Eso era el escalón de 600 a 601 -la miniatura, el relleno y
     el tope saltaban los tres a la vez al cruzar la media query- y una
     pantalla un píxel más ancha enseñaba una foto menos. */
  document.getElementById('barrer').addEventListener('click', async function () {
    var antesAncho = marco.style.width;
    informe.className = 'informe sale';
    informe.textContent = 'barriendo…';
    var filas = [], saltos = [], prev = null;
    for (var w = 300; w <= 1280; w++) {
      marco.style.width = w + 'px';
      var v = marco.contentWindow.ver();   // el marco no se recarga, sólo cambia de tamaño
      if (!prev || v.mini !== prev.mini || v.tira !== prev.tira || v.enteras !== prev.enteras) {
        if (prev && v.enteras < prev.enteras) saltos.push([prev, v]);
        filas.push(v); prev = v;
      }
      if (w % 120 === 0) await new Promise(function (r) { setTimeout(r, 0); });
    }
    marco.style.width = antesAncho;

    var t = 'Barrido de 300 a 1280 px con ' + cuantas + ' fotos.\n' +
            'Solo los anchos donde algo cambia.\n\n' +
            'ancho   miniatura   tira    enteras   recorte\n' +
            '-----   ---------   ----    -------   -------\n';
    filas.forEach(function (v) {
      t += String(v.W).padStart(5) + String(v.mini).padStart(12) +
           String(v.tira).padStart(8) + String(v.enteras + '/' + v.n).padStart(11) +
           '   ' + (v.desborda ? (v.asoma > 4 ? 'asoman ' + v.asoma : 'CORTE EN EL BORDE') : '—') + '\n';
    });
    t += '\n';
    if (saltos.length) {
      t += '<span class="mal">' + saltos.length + ' escalon(es): al ensanchar se ven MENOS fotos</span>\n';
      saltos.forEach(function (p) {
        t += '  ' + p[0].W + ' px: ' + p[0].enteras + ' enteras, pero ' +
             p[1].W + ' px: ' + p[1].enteras + '\n';
      });
    } else {
      t += '<span class="bien">Sin escalones: ensanchar nunca ensena menos fotos.</span>';
    }
    informe.innerHTML = t;
  });

  pintar();
})();
</script>
</body>
</html>
