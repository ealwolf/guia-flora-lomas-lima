<!-- Trepadora - una sola enredadera, al modo de Ipomoea tricolor o
     Cyclanthera mathewsii: un tallo que sube ENROSCADO en un tutor, con dos
     hojas acorazonadas colgando y dos zarcillos en espiral.

     El tutor es la vara recta y fina del centro; el tallo le da dos vueltas
     y media, holgadas. Para que se vea que lo abraza y no que lo cruza, el
     tallo se corta un poco cada vez que pasa por detrás y el tutor se corta
     cada vez que el tallo pasa por delante. Lo que la separa de la herbácea
     es justo eso: la hierba sube sola y derecha, la trepadora se apoya y se
     enrosca. Y lo que la separa de la parásita, que también se enrosca, son
     las hojas grandes con su nervio y los zarcillos -la trepadora es una
     planta completa, con las hojas puestas en su propio tallo- y las
     vueltas anchas y pocas; la cuscuta no tiene hoja y da vueltas
     apretadas. -->
