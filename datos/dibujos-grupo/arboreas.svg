<!-- Arbórea - un solo árbol, con la tara (Caesalpinia spinosa) y el
     huarango (Vachellia macracantha) en la cabeza: tronco corto y copa
     ancha y extendida, más ancha que alta.

     Lo que tiene que leerse a 60 px es el TRONCO: uno solo, dibujado con
     dos líneas que se cierran al subir para que tenga cuerpo y no sea un
     tallo más. Arriba se abre en tres brazos que cruzan la copa. La copa es
     el mismo contorno de bultos abierto por abajo que lleva la arbustiva,
     con su mancha tenue, pero más ancha y despegada del suelo: entre la
     copa y el suelo queda un hueco con sólo el tronco dentro, y ese hueco
     es lo que dice «árbol» y no «mata». La loma arbórea del juego de
     hábitats son dos taras sin contorno; aquí hace falta el contorno porque
     es un árbol solo y con los brazos desnudos parecía un candelabro. -->
