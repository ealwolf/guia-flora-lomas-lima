<!-- Ephedrales - una sola mata de pinco-pinco, Ephedra americana, la única
     del grupo: una escoba de tallos verdes, rectos y rígidos, sin una hoja,
     que se abren desde el pie.

     Lo que la hace reconocible son los NUDOS: el tallo va articulado como
     una caña, y en cada nudo hay un anillo de escamas y, a veces, salen
     ramitas en verticilo. Por eso cada tallo lleva rayitas cruzadas a
     trechos y de algunos nudos salen ramas rectas en ángulo cerrado. Todas
     las líneas son RECTAS: eso es lo que la separa de la hierba, que sube
     con vaivén y lleva hojas y flor, y de la cuscuta, que también va sin
     hojas pero es un hilo blando enroscado en otra planta. La Ephedra se
     sostiene sola, tiesa, y no se enrosca en nada. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
