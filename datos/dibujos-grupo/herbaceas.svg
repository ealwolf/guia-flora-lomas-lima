<!-- Herbácea — una sola planta de tallo blando, al modo de Alstroemeria
     lineatiflora o Anthericum eccremorrhizum, las hierbas de flor de la
     loma.

     Un tallo fino que sube derecho con un leve vaivén, tres hojas
     lanceoladas alternas, una flor abierta de cinco pétalos arriba y un
     capullo a un lado. Nada más: es el grupo de 102 especies, el «por
     defecto», y por eso es el dibujo más desnudo del juego. Lo que lo
     separa de la trepadora es que el tallo va ERGUIDO y solo, sin tutor y
     sin enroscarse; de la arbustiva, que es un tallo y no una mata; de la
     Ephedra, que lleva hojas y flor. La hierba del juego de hábitats es una
     estera que se corta con el lienzo; ésta es una planta entera, con su
     suelo corto debajo. -->
