<!-- Arbustiva - una sola mata leñosa, baja y redonda. No hay tronco: ésa es
     toda la diferencia con la arbórea de al lado, y aquí se dice con tres
     tallos finos que salen de un pie ANCHO, no de un punto.

     La copa baja hasta el suelo por los dos lados, cerrando la silueta
     contra la línea del terreno. Antes era un contorno abierto por abajo y
     los tallos salían radiando de un solo punto: entre el abanico de tallos
     y el borde festoneado, lo que se veía era una concha marina y no una
     mata. Cerrada y apoyada en el suelo, es un bulto de vegetación.

     Es la misma lengua que la arbórea -contorno, mancha tenue, ramitas de
     1,4- para que se vea que son parientes y que lo único que cambia es el
     esqueleto: tallos desde el pie y copa hasta el suelo aquí; tronco y copa
     en alto allá. La loma arbustiva del juego de hábitats son tres matas en
     fila sobre un campo que cruza el lienzo; ésta es una, entera y
     centrada. -->
