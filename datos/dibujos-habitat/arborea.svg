<!-- Loma arbórea — dos taras (Caesalpinia spinosa), el árbol grande de estas
     lomas. Salen de una foto del propio proyecto.

     Lo que hace reconocible a una tara no es la copa: es el esqueleto. Tronco
     corto, tres brazos que se abren en ángulo abierto y van quebrándose al
     subir, y una copa ANCHA Y PLANA, sin contorno. Por eso la copa es sólo
     una mancha tenue y las ramas se ven cruzándola de parte a parte: con el
     contorno cerrado sale el árbol de los cuentos, y con las hojas en bolas
     en la punta de cada rama salen dos piruletas. Las dos cosas se probaron.

     Las hojas son rayas cortas, no bolas: la tara tiene hoja compuesta de
     foliolos pequeños, y a 60 px de ancho una raya de 1,4 lo dice y un óvalo
     de 7 no.

     Antes eran dos especies distintas -tara y mito-. Ahora son dos del mismo
     árbol y juntos: lo que tiene que leerse no es «dos especies» sino «aquí
     hay arboleda». El segundo es menor y va medio paso atrás, como se ven en
     el campo, y la mancha es UNA SOLA y cruza los dos, que es lo que los cose
     en un bulto en vez de dejarlos como dos dibujos puestos al lado. -->
