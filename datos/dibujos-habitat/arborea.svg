<!-- Loma arbórea — la tara (Caesalpinia spinosa), el árbol mayor de estas
     lomas, y un segundo árbol menor. La tara sale de la foto de la propia
     guía (125_caesalpinia-spinosa_detalle2): tronco corto que se abre bajo,
     tres ramas y una copa plana y ancha que sobresale por fuera de ellas.
     El borde de la copa va a saltos y en tres tramos, que es lo que la
     separa del árbol de cuento; la sombra tenue le da el cuerpo que la
     línea sola no daba -sin ella parecía un paraguas colgado-. -->
