<!-- Loma arbórea — los dos árboles de estas lomas: la tara
     (Caesalpinia spinosa), la mayor, y el mito o papaya silvestre
     (Vasconcellea candicans). Los dos salen de las fotos de la propia
     guía, 125_caesalpinia-spinosa_detalle2 y
     124_vasconcellea-candicans_principal1.
     La tara: tronco corto, ramas que se abren mientras suben hasta el
     borde de la copa y se ven cruzándola, y una copa plana y ancha sin
     contorno -sólo la mancha y tres trozos de línea donde las ramitas
     se apelmazan-. Con el contorno entero salía el árbol de los
     cuentos: una nube posada en un palo.
     El mito: Y baja, ramillas peladas en abanico y cuatro hojas muy
     grandes sólo en las puntas. Uno es masa fina, el otro hoja grande
     y aire; así no se confunden aunque los dos sean «un árbol». -->
